<!doctype html>
<html lang="id" class="dark">

<!-- Tema diterapkan SEBELUM paint (kunci & default sama dengan ThemeProvider: bk-theme, default gelap). -->
<script>
  try {
    var t = localStorage.getItem("bk-theme");
    var dark = t !== "light";
    document.documentElement.classList.toggle("dark", dark);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", dark ? "#080e11" : "#eaf1f1");
  } catch (e) {
    document.documentElement.classList.add("dark");
  }
</script>

<style>
/* ======================================================================
   Halaman offline KomikFrost — mandiri (tanpa CSS Next.js), sehingga tetap
   tampil saat tanpa jaringan. Token & komponen disalin dari globals.css
   (blok "Layar mandiri") agar identik dengan 400 / 403 / 429 / masuk.
   ====================================================================== */
:root {
  color-scheme: light dark;
  --font-display: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-sans: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --color-ink: #080e11;
  --color-ink-2: #0f181c;
  --color-ink-3: #162227;
  --color-line-dark: #1f2f35;
  --color-paper: #eaf1f1;
  --color-line: #d6e2e3;
  --color-fg: #0d1518;
  --color-fg-dark: #e7f1f1;
  --color-muted: #566a70;
  --color-muted-dark: #8ba2a8;
  --color-accent: #0b6b66;
  --color-accent-strong: #064e4a;
}
html.dark {
  --color-accent: #118079;
  --color-accent-strong: #62d6c8;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { background-color: var(--color-paper); }
html.dark { background-color: var(--color-ink); }
body { margin: 0; }

.bs {
  --pg: var(--color-paper);
  --card: #ffffff;
  --ln: var(--color-line);
  --tx: var(--color-fg);
  --mu: var(--color-muted);
  --sp: #dcefed;
  --pk: rgba(11, 107, 102, 0.5);
  --pf: #ffffff;
  --t: #4d8fd1; /* bercak biru = "jaringan" (teal 400, amber 403, oranye 429) */
  --kfont: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", "Noto Sans JP", "Noto Sans CJK JP", var(--font-display), sans-serif;
  background: var(--pg);
  color: var(--tx);
  -webkit-tap-highlight-color: transparent;
  font-family: var(--font-sans);
  position: fixed; inset: 0; z-index: 300; overflow-y: auto; overflow-x: hidden;
}
html.dark .bs {
  --pg: var(--color-ink);
  --card: var(--color-ink-2);
  --ln: var(--color-line-dark);
  --tx: var(--color-fg-dark);
  --mu: var(--color-muted-dark);

}
.bs-inner {
  position: relative; z-index: 10; display: flex; min-height: 100%; align-items: center; justify-content: center;

}
@media (min-width: 640px) { .bs-inner { padding-left: 2rem; padding-right: 2rem; } }

/* ---- Susunan ------------------------------------------------------------ */
.mg-wrap { width: 100%; max-width: 62rem; display: flex; flex-direction: column; gap: 1rem; }

.mg-card {

}
.mg-title {

}
.mg-desc { margin: .85rem 0 0; font-size: .97rem; line-height: 1.6; color: var(--mu); max-width: 36ch; text-wrap: pretty; }

.mg-foot { margin-top: 1.6rem; padding-top: 1.1rem; border-top: 1px solid var(--ln); width: 100%; }

/* ---- Tombol (selaras tombol app) ---------------------------------------- */
.mg-btn {
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: .5rem;

.mg-btn:hover { border-color: var(--color-accent); color: var(--color-accent); }

.mg-btn-primary {

.mg-btn-primary:hover { color: #fff; border-color: transparent; background: var(--color-accent-strong); }

/* ---- Panel ilustrasi ----------------------------------------------------- */
.mg-scene {

.mg-sfx { right: 6cqw; top: 6cqw; z-index: 4; text-align: right; rotate: -6deg; animation: mg-slam .5s cubic-bezier(.2, 1.5, .4, 1) .3s both; }

  font: 700 3.5cqw/1.3 var(--font-sans); box-shadow: 0 2cqw 4cqw -2cqw rgba(0, 0, 0, .35);

}
.mg-bubble::after {
  content: ""; position: absolute; right: 5cqw; bottom: -2.6cqw; width: 4cqw; height: 3cqw; background: #fff;
  clip-path: polygon(0 0, 100% 0, 65% 100%);
}

/* Properti adegan: ikon sinyal putus */
.mg-signal { z-index: 2; width: 16cqw; left: 9cqw; top: 55cqw; rotate: -8deg; animation: mg-float 4s ease-in-out infinite; }

/* ---- Meteran sinyal (setara meteran stamina di 429) ---------------------- */
.mg-meter { margin-top: 1.4rem; width: 100%; max-width: 21rem; }
.mg-meter-head { display: flex; justify-content: space-between; align-items: baseline; font: 700 .68rem/1 var(--font-sans); letter-spacing: .1em; text-transform: uppercase; color: var(--mu); margin-bottom: .55rem; }
.mg-meter-head output { font: 700 .8rem/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0; color: var(--tx); text-transform: uppercase; }
.mg-meter-bar { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
.mg-meter-bar i { height: .6rem; border-radius: 3px; background: var(--ln); transition: background-color .3s; }
.mg-meter-bar i[data-on="1"] { background: var(--t); }
.mg-meter-msg { margin: .55rem 0 0; font-size: .78rem; color: var(--mu); }

/* ---- Mobile: satu layar penuh, tanpa scroll ------------------------------ */
@media (max-width: 859px) {
  .bs { overflow: hidden !important; }
  .bs-inner { height: 100%; min-height: 0; padding: max(.75rem, env(safe-area-inset-top)) 1rem max(.75rem, env(safe-area-inset-bottom)); }
  .mg-wrap { gap: .6rem; }
  .mg-card { border-radius: 22px; }
  .mg-card > .mg-scene {
    width: min(calc(100% - 20px), max(9.5rem, calc((100dvh - var(--bs-rest, 26rem)) / .86)));
    margin: 10px auto 0; border-radius: 16px;
  }
  .mg-body, .mg-form { padding: 1rem 1.1rem 1.15rem; }
  .mg-kicker { margin-bottom: .7rem; }
  .mg-title { font-size: clamp(1.45rem, 6.4vw, 1.8rem); }
  .mg-desc { margin-top: .55rem; font-size: .88rem; line-height: 1.5; max-width: none; }
  .mg-meter { margin-top: .9rem; max-width: none; }
  .mg-actions { flex-direction: row; flex-wrap: nowrap; gap: .55rem; margin-top: 1.1rem; }
  .mg-actions > .mg-btn { flex: 1 1 0; min-width: 0; height: 2.85rem; padding: 0 .8rem; }
  .mg-links, .mg-foot { display: none; }
  .mg-note { margin-top: .7rem; }
  .mg-input { height: 3rem; }
  .mg-fine { margin-top: .8rem; }
  .mg-card:has(.mg-form, .mg-note) { --bs-rest: 28.5rem; }
}

/* ---- Gerak -------------------------------------------------------------- */

@keyframes yk-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

<div class="bs" data-bare-screen>
  <div class="bs-tone-page" aria-hidden="true"></div>

 d="M-9 -12.2 L-3 -13.6 Q1.2 0 -3 13.6 L-9 12.2 Q-6.6 0 -9 -12.2 Z" fill="#1a9a92"></path><path d="M-9 -8 q-2 2.4 0 4.8 M-9 -1.6 q-2.6 3 0 6 M-9 5.2 q-2 2.4 0 4.8" fill="none" stroke="#f6f3ee" stroke-width="1.8" stroke-linecap="round"></path><path d="M-3 -13.6 Q1.2 0 -3 13.6" fill="none" stroke="#0d1518" stroke-width="2.8" stroke-linecap="round"></path><path d="M-19 -6 L-10 -7.4" stroke="#b9b1a4" stroke-width="1.6" stroke-linecap="round" opacity="0.6"></path></g><g fill="#0d1518" stroke="#0d1518" stroke-width="5.6" stroke-linejoin="round"><ellipse cx="7" cy="0" rx="11" ry="9.4"></ellipse><circle cx="17.6" cy="-5.6" r="4.6"></circle><circle cx="20" cy="0" r="4.8"></circle><circle cx="17.6" cy="5.6" r="4.6"></circle></g><g fill="#1a9a92"><ellipse cx="7" cy="0" rx="11" ry="9.4"></ellipse><circle cx="17.6" cy="-5.6" r="4.6"></circle><circle cx="20" cy="0" r="4.8"></circle><circle cx="17.6" cy="5.6" r="4.6"></circle></g><path d="M0 6.4 C7 9.6 15 9.2 20.6 5 C19.4 9.2 14 11 8 10.6 C4 10.2 1.4 8.6 0 6.4 Z" fill="#0b6b66" opacity="0.7"></path><path d="M0.5 -7 C5 -8.8 10 -8.8 14 -8" fill="none" stroke="#3cc0b4" stroke-width="2" stroke-linecap="round" opacity="0.9"></path><path d="M13.8 -2.9 L18.6 -2.9 M13.8 2.9 L18.6 2.9" stroke="#0d1518" stroke-width="1.8" stroke-linecap="round"></path><path d="M3.6 0 C3.6 -3 6 -4 8 -3.2 C10.4 -2.4 10.4 2.4 8 3.2 C6 4 3.6 3 3.6 0 Z" fill="#bfdedb" opacity="0.95"></path></g></g></g></g></g></svg>

          <p class="mg-bubble" id="bubble">Eh? Sinyalnya hilang…</p>
          <div class="mg-sfx">
            <b lang="ja">プツッ</b>
            <i>putsu</i>
          </div>
        </div>

        <!-- ============ Teks + aksi ============ -->
        <div class="mg-body">
          <p class="mg-kicker"><span>OFF</span>Tidak ada koneksi</p>
          <h1 class="mg-title">Koneksimu terputus</h1>
          <p class="mg-desc">KomikFrost butuh jaringan untuk memuat komik dari sumbernya. Sambungkan internet, lalu coba lagi.</p>

          <div class="mg-meter" role="timer" aria-live="off">
            <div class="mg-meter-head">
              <span>Sinyal Yuki</span>
              <output id="signal-out">Terputus</output>
            </div>
            <div class="mg-meter-bar" id="signal-bar" aria-hidden="true">
              <i data-on="0"></i><i data-on="0"></i><i data-on="0"></i><i data-on="0"></i>
              <i data-on="0"></i><i data-on="0"></i><i data-on="0"></i><i data-on="0"></i>
              <i data-on="0"></i><i data-on="0"></i><i data-on="0"></i><i data-on="0"></i>
            </div>
            <p class="mg-meter-msg" id="signal-msg" role="status" aria-live="polite">Mencoba menyambung lagi otomatis…</p>
          </div>

          <div class="mg-actions">
            <button type="button" id="retry" class="mg-btn mg-btn-primary">
              <svg id="retry-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" /></svg>
              <span id="retry-label">Coba lagi</span>
            </button>
            <a href="/" class="mg-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7v8.5a.5.5 0 0 1-.5.5H15v-6H9v6H4.5a.5.5 0 0 1-.5-.5V11Z" /></svg>
              Ke beranda
            </a>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
(function () {
  var btn = document.getElementById("retry");
  var label = document.getElementById("retry-label");
  var ico = document.getElementById("retry-ico");
  var out = document.getElementById("signal-out");
  var msg = document.getElementById("signal-msg");
  var bubble = document.getElementById("bubble");
  var bars = Array.prototype.slice.call(document.querySelectorAll("#signal-bar i"));
  var card = document.getElementById("card");
  var busy = false;

  function setBars(n) {
    for (var i = 0; i < bars.length; i++) bars[i].setAttribute("data-on", i < n ? "1" : "0");
  }
  function say(text) {
    bubble.textContent = text;
    bubble.style.animation = "none";
    void bubble.offsetWidth;
    bubble.style.animation = "mg-pop .4s cubic-bezier(.2, 1.5, .4, 1) both";
  }

  // Server dianggap terjangkau bila ada respons HTTP APA PUN (termasuk 401/403/429);
  // hanya galat jaringan / timeout yang berarti masih offline.
  function reachable() {
    var ctrl = typeof AbortController === "function" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 6000);
    return fetch("/api/health?_=" + Date.now(), { cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
      .then(function () { clearTimeout(timer); return true; })
      .catch(function () { clearTimeout(timer); return false; });
  }

  function check(manual) {
    if (busy) return;
    busy = true;
    if (manual) {
      btn.disabled = true;
      label.textContent = "Memeriksa…";
      ico.classList.add("mg-spin");
    }
    out.textContent = "Memeriksa…";
    msg.textContent = "Mencari sinyal…";

    var step = 0;
    var sweep = setInterval(function () { step = (step + 1) % 13; setBars(step); }, 70);
    var started = Date.now();

    reachable().then(function (ok) {
      // beri jeda minimum agar animasi meteran terbaca
      var wait = Math.max(0, 700 - (Date.now() - started));
      setTimeout(function () {
        clearInterval(sweep);
        busy = false;
        if (ok) {
          setBars(12);
          out.textContent = "Tersambung";
          msg.textContent = "Sinyal kembali — memuat ulang…";
          say("Yay, sudah nyambung!");
          label.textContent = "Memuat…";
          setTimeout(function () { location.reload(); }, 450);
        } else {
          setBars(0);
          out.textContent = "Terputus";
          msg.textContent = "Belum ada sinyal. Mencoba lagi otomatis…";
          if (manual) {
            btn.disabled = false;
            label.textContent = "Coba lagi";
            ico.classList.remove("mg-spin");
            say("Masih belum nyambung…");
            card.classList.remove("mg-shake");
            void card.offsetWidth;
            card.classList.add("mg-shake");
          }
        }
      }, wait);
    });
  }

  btn.addEventListener("click", function () { check(true); });
  window.addEventListener("online", function () { check(false); });
  setInterval(function () {
    if (document.visibilityState === "visible") check(false);
  }, 12000);
})();
</script>
