<!doctype html>
<html lang="id" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080e11" />
<meta name="robots" content="noindex, nofollow" />
<title>Tidak ada koneksi · KomikFrost</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml" />

<!-- Tema diterapkan SEBELUM paint (kunci & default sama dengan ThemeProvider: bk-theme, default gelap). -->
<script>
  try {
    var t = localStorage.getItem("bk-theme");
    var dark = t !== "light";
    document.documentElement.classList.toggle("dark", dark);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", dark ? "#080e11" : "#eaf1f1");
  } catch (e) {
    document.documentElement.classList.add("dark");
  }
</script>

<style>
/* ======================================================================
   Halaman offline KomikFrost — mandiri (tanpa CSS Next.js), sehingga tetap
   tampil saat tanpa jaringan. Token & komponen disalin dari globals.css
   (blok "Layar mandiri") agar identik dengan 400 / 403 / 429 / masuk.
   ====================================================================== */
:root {
  color-scheme: light dark;
  --font-display: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-sans: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --color-ink: #080e11;
  --color-ink-2: #0f181c;
  --color-ink-3: #162227;
  --color-line-dark: #1f2f35;
  --color-paper: #eaf1f1;
  --color-line: #d6e2e3;
  --color-fg: #0d1518;
  --color-fg-dark: #e7f1f1;
  --color-muted: #566a70;
  --color-muted-dark: #8ba2a8;
  --color-accent: #0b6b66;
  --color-accent-strong: #064e4a;
}
html.dark {
  --color-accent: #118079;
  --color-accent-strong: #62d6c8;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { background-color: var(--color-paper); }
html.dark { background-color: var(--color-ink); }
body { margin: 0; }

.bs {
  --pg: var(--color-paper);
  --card: #ffffff;
  --ln: var(--color-line);
  --tx: var(--color-fg);
  --mu: var(--color-muted);
  --sp: #dcefed;
  --pk: rgba(11, 107, 102, 0.5);
  --pf: #ffffff;
  --t: #4d8fd1; /* bercak biru = "jaringan" (teal 400, amber 403, oranye 429) */
  --kfont: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", "Noto Sans JP", "Noto Sans CJK JP", var(--font-display), sans-serif;
  background: var(--pg);
  color: var(--tx);
  -webkit-tap-highlight-color: transparent;
  font-family: var(--font-sans);
  position: fixed; inset: 0; z-index: 300; overflow-y: auto; overflow-x: hidden;
}
html.dark .bs {
  --pg: var(--color-ink);
  --card: var(--color-ink-2);
  --ln: var(--color-line-dark);
  --tx: var(--color-fg-dark);
  --mu: var(--color-muted-dark);
  --sp: #123033;
  --pk: rgba(127, 227, 214, 0.45);
  --pf: #1c3f43;
}

.bs-tone-page {
  position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle, var(--ln) 1.2px, transparent 1.6px);
  background-size: 9px 9px;
  -webkit-mask-image: radial-gradient(55% 60% at 0% 100%, #000, transparent 70%), radial-gradient(45% 50% at 100% 0%, #000, transparent 70%);
  mask-image: radial-gradient(55% 60% at 0% 100%, #000, transparent 70%), radial-gradient(45% 50% at 100% 0%, #000, transparent 70%);
  opacity: .8;
}
.bs-inner {
  position: relative; z-index: 10; display: flex; min-height: 100%; align-items: center; justify-content: center;
  padding: max(1.5rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
}
@media (min-width: 640px) { .bs-inner { padding-left: 2rem; padding-right: 2rem; } }

/* ---- Susunan ------------------------------------------------------------ */
.mg-wrap { width: 100%; max-width: 62rem; display: flex; flex-direction: column; gap: 1rem; }
.mg-brand {
  align-self: flex-start; display: inline-flex; align-items: center; gap: .6rem;
  font: 800 1.05rem/1 var(--font-display); color: var(--tx); text-decoration: none;
}
.mg-brand em { font-style: normal; color: var(--color-accent); }
html.dark .mg-brand em { color: var(--color-accent-strong); }
.brand-tile {
  display: flex; flex-shrink: 0; align-items: center; justify-content: center; width: 2rem; height: 2rem;
  border-radius: 10%; color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18);
  background: radial-gradient(120% 120% at 76% 84%, rgba(98, 214, 200, .34) 0%, rgba(98, 214, 200, 0) 68%), linear-gradient(145deg, #1a9a92 0%, #0b6b66 52%, #064e4a 100%);
}
.brand-tile svg { width: 78%; height: 78%; }

.mg-card {
  display: grid; grid-template-columns: 1fr; gap: 0; overflow: hidden;
  background: var(--card); border: 1px solid var(--ln); border-radius: 28px;
  box-shadow: 0 30px 70px -40px rgba(6, 78, 74, .45);
}
html.dark .mg-card { box-shadow: 0 40px 80px -40px rgba(0, 0, 0, .8); }
@media (min-width: 860px) {
  .mg-card { grid-template-columns: minmax(0, 1fr) minmax(0, 1.04fr); align-items: center; padding: 14px; }
}
.mg-card > .mg-scene { margin: 12px 12px 0; }
@media (min-width: 860px) { .mg-card > .mg-scene { margin: 0; } }

.mg-body { padding: 1.5rem 1.5rem 1.7rem; display: flex; flex-direction: column; align-items: flex-start; }
@media (min-width: 860px) { .mg-body { padding: 2.2rem 2.6rem 2.4rem; } }

.mg-kicker {
  display: inline-flex; align-items: center; gap: .5rem; margin: 0 0 1rem; padding: .3rem .8rem .3rem .35rem;
  border: 1px solid var(--ln); border-radius: 999px; background: color-mix(in srgb, var(--t) 10%, transparent);
  font: 700 .72rem/1 var(--font-sans); color: var(--mu);
}
.mg-kicker > span {
  display: grid; place-items: center; height: 1.45rem; padding: 0 .55rem; border-radius: 999px;
  background: var(--t); color: #0d1518; font: 800 .72rem/1 var(--font-display); letter-spacing: .04em;
}
.mg-title {
  margin: 0; font: 900 clamp(1.7rem, 4.4vw, 2.5rem)/1.06 var(--font-display);
  font-stretch: 108%; letter-spacing: -.025em; text-wrap: balance;
}
.mg-desc { margin: .85rem 0 0; font-size: .97rem; line-height: 1.6; color: var(--mu); max-width: 36ch; text-wrap: pretty; }

.mg-actions { display: flex; flex-direction: column; gap: .7rem; margin-top: 1.7rem; width: 100%; }
@media (min-width: 480px) { .mg-actions { flex-direction: row; flex-wrap: wrap; width: auto; } }

.mg-foot { margin-top: 1.6rem; padding-top: 1.1rem; border-top: 1px solid var(--ln); width: 100%; }
.mg-note { margin: 0; font-size: .75rem; line-height: 1.45; color: var(--mu); }

/* ---- Tombol (selaras tombol app) ---------------------------------------- */
.mg-btn {
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  height: 3rem; padding: 0 1.4rem; cursor: pointer; text-decoration: none; white-space: nowrap;
  font: 600 .88rem/1 var(--font-sans); color: var(--tx);
  background: color-mix(in srgb, var(--card) 60%, transparent); border: 1px solid var(--ln); border-radius: 12px;
  transition: transform .2s, border-color .2s, color .2s, filter .2s;
}
.mg-btn:hover { border-color: var(--color-accent); color: var(--color-accent); }
html.dark .mg-btn:hover { border-color: var(--color-accent-strong); color: var(--color-accent-strong); }
.mg-btn:active { transform: scale(.97); }
.mg-btn:focus-visible, .mg-brand:focus-visible { outline: 3px solid color-mix(in srgb, var(--color-accent) 45%, transparent); outline-offset: 3px; }
.mg-btn-primary {
  color: #fff; border-color: transparent; background: var(--color-accent);
}
.mg-btn-primary:hover { color: #fff; border-color: transparent; background: var(--color-accent-strong); }
html.dark .mg-btn-primary:hover { color: #fff; background: #1a9a92; }
.mg-btn:disabled { opacity: .5; cursor: not-allowed; }
.mg-btn svg { width: 1rem; height: 1rem; flex-shrink: 0; }

/* ---- Panel ilustrasi ----------------------------------------------------- */
.mg-scene {
  position: relative; container-type: inline-size; overflow: hidden; user-select: none;
  aspect-ratio: 1 / .86; border-radius: 20px; background: var(--sp); color: var(--pk);
}
@media (min-width: 860px) { .mg-scene { aspect-ratio: 1 / 1.02; border-radius: 18px; } }
.mg-scene > * { position: absolute; }

.mg-tone {
  inset: 0;
  background-image: radial-gradient(circle, var(--pk) 1.3px, transparent 1.7px);
  background-size: 10px 10px; opacity: .35;
  -webkit-mask-image: linear-gradient(200deg, #000 0%, transparent 55%);
  mask-image: linear-gradient(200deg, #000 0%, transparent 55%);
}
.mg-focus {
  inset: -30%;
  background: repeating-conic-gradient(from 2deg at 50% 66%, var(--pk) 0 .45deg, transparent .45deg 7.5deg);
  -webkit-mask-image: radial-gradient(circle at 50% 66%, transparent 20%, #000 48%, transparent 72%);
  mask-image: radial-gradient(circle at 50% 66%, transparent 20%, #000 48%, transparent 72%);
  opacity: .55; animation: mg-jitter .5s steps(2, end) infinite;
}
.mg-glow {
  inset: 0;
  background: radial-gradient(50% 42% at 50% 70%, color-mix(in srgb, var(--t) 28%, transparent), transparent 70%);
}
.mg-code {
  left: 50%; top: 8cqw; translate: -50% 0;
  font: 900 34cqw/1 var(--font-display); font-stretch: 112%; letter-spacing: -.04em;
  color: transparent; -webkit-text-stroke: .5cqw color-mix(in srgb, var(--t) 70%, transparent); opacity: .55;
  white-space: nowrap;
}
.mg-yuki { left: 50%; bottom: 3cqw; width: 52cqw; translate: -50% 0; z-index: 3; }
.mg-yuki > svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 2cqw 3cqw rgba(0, 0, 0, .28)); }

.mg-sfx { right: 6cqw; top: 6cqw; z-index: 4; text-align: right; rotate: -6deg; animation: mg-slam .5s cubic-bezier(.2, 1.5, .4, 1) .3s both; }
.mg-sfx b {
  display: block; font: 900 10.5cqw/1 var(--kfont); letter-spacing: -.02em; transform: skewX(-6deg);
  color: transparent; -webkit-text-stroke: .55cqw var(--t);
}
.mg-sfx i {
  display: inline-block; margin-top: 1cqw; font: 600 2.7cqw/1 ui-monospace, SFMono-Regular, Menlo, monospace; font-style: normal;
  letter-spacing: .2em; text-transform: uppercase; color: var(--t);
}

.mg-bubble {
  left: 6cqw; top: 31cqw; z-index: 5; margin: 0; max-width: 36cqw;
  background: #fff; color: #0d1518; border-radius: 4.5cqw; padding: 2.6cqw 3.6cqw;
  font: 700 3.5cqw/1.3 var(--font-sans); box-shadow: 0 2cqw 4cqw -2cqw rgba(0, 0, 0, .35);
  transform-origin: 85% 100%; animation: mg-pop .4s cubic-bezier(.2, 1.5, .4, 1) .7s both;
}
.mg-bubble::after {
  content: ""; position: absolute; right: 5cqw; bottom: -2.6cqw; width: 4cqw; height: 3cqw; background: #fff;
  clip-path: polygon(0 0, 100% 0, 65% 100%);
}

/* Properti adegan: ikon sinyal putus */
.mg-signal { z-index: 2; width: 16cqw; left: 9cqw; top: 55cqw; rotate: -8deg; animation: mg-float 4s ease-in-out infinite; }

/* ---- Meteran sinyal (setara meteran stamina di 429) ---------------------- */
.mg-meter { margin-top: 1.4rem; width: 100%; max-width: 21rem; }
.mg-meter-head { display: flex; justify-content: space-between; align-items: baseline; font: 700 .68rem/1 var(--font-sans); letter-spacing: .1em; text-transform: uppercase; color: var(--mu); margin-bottom: .55rem; }
.mg-meter-head output { font: 700 .8rem/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0; color: var(--tx); text-transform: uppercase; }
.mg-meter-bar { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
.mg-meter-bar i { height: .6rem; border-radius: 3px; background: var(--ln); transition: background-color .3s; }
.mg-meter-bar i[data-on="1"] { background: var(--t); }
.mg-meter-msg { margin: .55rem 0 0; font-size: .78rem; color: var(--mu); }

/* ---- Mobile: satu layar penuh, tanpa scroll ------------------------------ */
@media (max-width: 859px) {
  .bs { overflow: hidden !important; }
  .bs-inner { height: 100%; min-height: 0; padding: max(.75rem, env(safe-area-inset-top)) 1rem max(.75rem, env(safe-area-inset-bottom)); }
  .mg-wrap { gap: .6rem; }
  .mg-brand { font-size: .95rem; }
  .mg-card { border-radius: 22px; }
  .mg-card > .mg-scene {
    width: min(calc(100% - 20px), max(9.5rem, calc((100dvh - var(--bs-rest, 26rem)) / .86)));
    margin: 10px auto 0; border-radius: 16px;
  }
  .mg-body, .mg-form { padding: 1rem 1.1rem 1.15rem; }
  .mg-kicker { margin-bottom: .7rem; }
  .mg-title { font-size: clamp(1.45rem, 6.4vw, 1.8rem); }
  .mg-desc { margin-top: .55rem; font-size: .88rem; line-height: 1.5; max-width: none; }
  .mg-meter { margin-top: .9rem; max-width: none; }
  .mg-actions { flex-direction: row; flex-wrap: nowrap; gap: .55rem; margin-top: 1.1rem; }
  .mg-actions > .mg-btn { flex: 1 1 0; min-width: 0; height: 2.85rem; padding: 0 .8rem; }
  .mg-links, .mg-foot { display: none; }
  .mg-note { margin-top: .7rem; }
  .mg-input { height: 3rem; }
  .mg-fine { margin-top: .8rem; }
  .mg-card:has(.mg-form, .mg-note) { --bs-rest: 28.5rem; }
}

/* ---- Gerak -------------------------------------------------------------- */
.mg-in { animation: mg-in .6s cubic-bezier(.22, 1, .36, 1) both; animation-delay: var(--d, 0ms); }
.mg-spin { animation: mg-spin .8s linear infinite; }
.mg-shake { animation: mg-shake .42s cubic-bezier(.36, .07, .19, .97) both; }

@keyframes mg-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes mg-slam { 0% { opacity: 0; scale: 1.8; } 60% { opacity: 1; scale: .96; } 100% { opacity: 1; scale: 1; } }
@keyframes mg-pop { from { opacity: 0; scale: .4; } to { opacity: 1; scale: 1; } }
@keyframes mg-jitter { 0% { rotate: 0deg; } 100% { rotate: .8deg; } }
@keyframes mg-float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -2cqw; } }
@keyframes mg-spin { to { transform: rotate(360deg); } }
@keyframes mg-shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-6px); } 40%, 60% { transform: translateX(6px); } }

/* Maskot Yuki */
.yk-bob { animation: yk-bob 2.4s ease-in-out infinite; }
.yk-blink { transform-box: fill-box; transform-origin: center; animation: yk-blink 4.2s infinite; }
.yk-tail { transform-origin: 134px 182px; animation: yk-tail 2.4s ease-in-out infinite; }
.yk-fox-tail { transform-origin: 134px 196px; animation: yk-swish 2.8s ease-in-out infinite; }
.yk-drip { animation: yk-drip 1.8s ease-in infinite; }
.yk-qmark { transform-box: fill-box; transform-origin: 50% 90%; animation: yk-qmark 2s ease-in-out infinite; }
@keyframes yk-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes yk-blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
@keyframes yk-swish { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(6deg); } }
@keyframes yk-tail { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(7deg); } }
@keyframes yk-drip { 0% { opacity: 0; transform: translateY(-6px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(22px); } }
@keyframes yk-qmark { 0%, 100% { transform: rotate(-8deg) translateY(0); } 50% { transform: rotate(8deg) translateY(-4px); } }

@media (prefers-reduced-motion: reduce) {
  .mg-in, .mg-sfx, .mg-bubble, .mg-focus, .mg-signal, .mg-spin, .mg-shake,
  .yk-bob, .yk-blink, .yk-tail, .yk-fox-tail, .yk-drip, .yk-qmark { animation: none !important; }
}
</style>
</head>

<body>
<div class="bs" data-bare-screen>
  <div class="bs-tone-page" aria-hidden="true"></div>

  <div class="bs-inner">
    <main class="mg-wrap" role="main">

      <a href="/" class="mg-brand mg-in" aria-label="KomikFrost — ke beranda">
        <span class="brand-tile" aria-hidden="true">
          <svg viewBox="48 48 160 160" fill="currentColor"><path fill-rule="evenodd" d="M64 64H124L96 128L124 192H64Z M156 64H192V192H156L128 128Z" /></svg>
        </span>
        <span>Komik<em>Frost</em></span>
      </a>

      <div class="mg-card mg-in" id="card" style="--d: 80ms">

        <!-- ============ Panel ilustrasi ============ -->
        <div class="mg-scene" data-mood="lost" aria-hidden="true">
          <div class="mg-tone"></div>
          <div class="mg-focus"></div>
          <div class="mg-glow"></div>
          <div class="mg-code">OFF</div>

          <!-- properti: ikon sinyal dicoret -->
          <svg class="mg-signal" viewBox="0 0 56 50" fill="none">
            <g stroke="var(--pk)" stroke-width="3.6" stroke-linecap="round">
              <path d="M4 17 Q28 -2 52 17" />
              <path d="M12 27 Q28 12 44 27" />
              <path d="M20 36 Q28 29 36 36" />
            </g>
            <circle cx="28" cy="44" r="3.6" fill="var(--t)" />
            <path d="M7 5 L49 47" stroke="var(--sp)" stroke-width="8" stroke-linecap="round" />
            <path d="M7 5 L49 47" stroke="var(--t)" stroke-width="3.6" stroke-linecap="round" />
          </svg>

          <!-- Yuki si rubah (ekspresi "lost": bingung mencari sinyal) -->

        <!-- ============ Teks + aksi ============ -->
        <div class="mg-body">
          <p class="mg-kicker"><span>OFF</span>Tidak ada koneksi</p>
          <h1 class="mg-title">Koneksimu terputus</h1>
          <p class="mg-desc">KomikFrost butuh jaringan untuk memuat komik dari sumbernya. Sambungkan internet, lalu coba lagi.</p>

          <div class="mg-meter" role="timer" aria-live="off">
            <div class="mg-meter-head">
              <span>Sinyal Yuki</span>
              <output id="signal-out">Terputus</output>
            </div>
            <div class="mg-meter-bar" id="signal-bar" aria-hidden="true">
              <i data-on="0"></i><i data-on="0"></i><i data-on="0"></i><i data-on="0"></i>
              <i data-on="0"></i><i data-on="0"></i><i data-on="0"></i><i data-on="0"></i>
              <i data-on="0"></i><i data-on="0"></i><i data-on="0"></i><i data-on="0"></i>
            </div>
            <p class="mg-meter-msg" id="signal-msg" role="status" aria-live="polite">Mencoba menyambung lagi otomatis…</p>
          </div>

          <div class="mg-actions">
            <button type="button" id="retry" class="mg-btn mg-btn-primary">
              <svg id="retry-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" /></svg>
              <span id="retry-label">Coba lagi</span>
            </button>
            <a href="/" class="mg-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7v8.5a.5.5 0 0 1-.5.5H15v-6H9v6H4.5a.5.5 0 0 1-.5-.5V11Z" /></svg>
              Ke beranda
            </a>
          </div>
        </div>

<script>
(function () {
  var btn = document.getElementById("retry");
  var label = document.getElementById("retry-label");
  var ico = document.getElementById("retry-ico");
  var out = document.getElementById("signal-out");
  var msg = document.getElementById("signal-msg");
  var bubble = document.getElementById("bubble");
  var bars = Array.prototype.slice.call(document.querySelectorAll("#signal-bar i"));
  var card = document.getElementById("card");
  var busy = false;

  function setBars(n) {
    for (var i = 0; i < bars.length; i++) bars[i].setAttribute("data-on", i < n ? "1" : "0");
  }
  function say(text) {
    bubble.textContent = text;
    bubble.style.animation = "none";
    void bubble.offsetWidth;
    bubble.style.animation = "mg-pop .4s cubic-bezier(.2, 1.5, .4, 1) both";
  }

  // Server dianggap terjangkau bila ada respons HTTP APA PUN (termasuk 401/403/429);
  // hanya galat jaringan / timeout yang berarti masih offline.
  function reachable() {
    var ctrl = typeof AbortController === "function" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 6000);
    return fetch("/api/health?_=" + Date.now(), { cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
      .then(function () { clearTimeout(timer); return true; })
      .catch(function () { clearTimeout(timer); return false; });
  }

  function check(manual) {
    if (busy) return;
    busy = true;
    if (manual) {
      btn.disabled = true;
      label.textContent = "Memeriksa…";
      ico.classList.add("mg-spin");
    }
    out.textContent = "Memeriksa…";
    msg.textContent = "Mencari sinyal…";

    var step = 0;
    var sweep = setInterval(function () { step = (step + 1) % 13; setBars(step); }, 70);
    var started = Date.now();

    reachable().then(function (ok) {
      // beri jeda minimum agar animasi meteran terbaca
      var wait = Math.max(0, 700 - (Date.now() - started));
      setTimeout(function () {
        clearInterval(sweep);
        busy = false;
        if (ok) {
          setBars(12);
          out.textContent = "Tersambung";
          msg.textContent = "Sinyal kembali — memuat ulang…";
          say("Yay, sudah nyambung!");
          label.textContent = "Memuat…";
          setTimeout(function () { location.reload(); }, 450);
        } else {
          setBars(0);
          out.textContent = "Terputus";
          msg.textContent = "Belum ada sinyal. Mencoba lagi otomatis…";
          if (manual) {
            btn.disabled = false;
            label.textContent = "Coba lagi";
            ico.classList.remove("mg-spin");
            say("Masih belum nyambung…");
            card.classList.remove("mg-shake");
            void card.offsetWidth;
            card.classList.add("mg-shake");
          }
        }
      }, wait);
    });
  }

  btn.addEventListener("click", function () { check(true); });
  window.addEventListener("online", function () { check(false); });
  setInterval(function () {
    if (document.visibilityState === "visible") check(false);
  }, 12000);
})();
</script>
