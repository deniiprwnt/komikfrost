<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tidak ada koneksi — KomikFrost</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b1013" />
    <style>
      :root {
        --ink: #090d10;
        --ink-2: #10161a;
        --line: #1e2a30;
        --fg: #eaf1f2;
        --muted: #8fa0a7;
        --accent: #0f8f79;
        --accent-strong: #0a7562;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top, 0px) + 24px) 24px
                 calc(env(safe-area-inset-bottom, 0px) + 24px);
        background: var(--ink);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      main { width: 100%; max-width: 22rem; text-align: center; }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        border-radius: 16px;
        background:
          radial-gradient(120% 120% at 76% 84%, rgba(30, 143, 120, 0.45) 0%, rgba(22, 120, 102, 0) 68%),
          linear-gradient(145deg, #1d3a3f 0%, #101d21 55%, #0a1417 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
        color: #fff;
        margin-bottom: 20px;
      }
      .mark svg { width: 56px; height: 56px; }
      h1 {
        font-size: 1.5rem;
        line-height: 1.2;
        letter-spacing: -0.02em;
        margin: 0 0 8px;
        font-weight: 800;
      }
      h1 span { color: var(--accent); }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.6;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 700;
        padding: 12px 22px;
        min-height: 44px;
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.1s ease;
      }
      button:hover { background: var(--accent-strong); }
      button:active { transform: scale(0.97); }
      .hint {
        margin: 20px 0 0;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        font-size: 0.75rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">
        <svg viewBox="48 48 160 160" fill="currentColor">
          <path fill-rule="evenodd" d="M64 64H124L96 128L124 192H64Z M156 64H192V192H156L128 128Z" />
        </svg>
      </span>
      <h1>Tidak ada koneksi<span>.</span></h1>
      <p>
        KomikFrost butuh jaringan untuk memuat komik dari sumbernya.
        Sambungkan internet, lalu coba lagi.
      </p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
      <p class="hint">Halaman ini disimpan di perangkatmu oleh service worker.</p>
    </main>
  </body>
</html>
